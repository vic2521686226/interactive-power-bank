<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Power Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Interactive Power Bank</h1>
    <div class="bank">
      <div class="bank-top">
        <p class="bank-name">POWER BANK</p>
        <button id="power" type="button" aria-label="Press power">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v8M7 6a8 8 0 1 0 10 0"/>
          </svg>
        </button>
      </div>
      <div class="display">
        <span id="battery-value">70%</span>
        <p id="summary" role="status">0 devices charging</p>
      </div>
      <div class="ports" aria-hidden="true"><span></span><span></span></div>
    </div>

    <div class="cables">
      <section class="cable" id="cable-1" data-state="disconnected">
        <svg class="wire" viewBox="0 0 120 105" aria-hidden="true">
          <path d="M60 0v12c0 19 -29 13 -29 32S60 64 60 82"
                fill="none" stroke="currentColor" stroke-width="8"/>
          <rect x="50" y="72" width="20" height="20" rx="5" fill="currentColor"/>
          <rect x="54" y="90" width="12" height="10" rx="2" fill="#647286"/>
        </svg>
        <svg class="device" viewBox="0 0 104 108" aria-hidden="true">
          <rect x="46" y="0" width="12" height="6" rx="2" fill="#151f2a"/>
          <rect x="24" y="3" width="56" height="102" rx="10" fill="#242e3a"/>
          <rect x="29" y="8" width="46" height="92" rx="6" fill="#d9e7f5"/>
          <rect x="45" y="11" width="14" height="3" rx="1.5" fill="#46596f"/>
          <rect x="40" y="46" width="23" height="13" rx="3" fill="none" stroke="#46596f" stroke-width="2"/>
          <rect x="64" y="50" width="2" height="5" rx="1" fill="#46596f"/>
          <rect class="device-led" x="43" y="49" width="17" height="7" rx="1"/>
        </svg>
        <h2>Phone</h2>
        <p class="cable-name">Dark blue cable</p>
        <p class="status" aria-live="polite">
          <span class="light" aria-hidden="true"></span>
          <span class="state-label">Disconnected</span>
        </p>
        <button type="button">Plug in phone</button>
      </section>
      <section class="cable" id="cable-2" data-state="disconnected">
        <svg class="wire" viewBox="0 0 120 105" aria-hidden="true">
          <path d="M60 0v12c0 19 29 13 29 32S60 64 60 82"
                fill="none" stroke="currentColor" stroke-width="8"/>
          <rect x="50" y="72" width="20" height="20" rx="5" fill="currentColor"/>
          <rect x="54" y="90" width="12" height="10" rx="2" fill="#647286"/>
        </svg>
        <svg class="device" viewBox="0 0 104 108" aria-hidden="true">
          <rect x="46" y="0" width="12" height="6" rx="2" fill="#515e70"/>
          <rect x="8" y="3" width="88" height="60" rx="20" fill="#dbe3ed" stroke="#637389" stroke-width="2"/>
          <path d="M9 30h86" stroke="#637389" stroke-width="2"/>
          <circle class="device-led" cx="52" cy="44" r="4"/>
        </svg>
        <h2>Wireless earbuds</h2>
        <p class="cable-name">Light blue cable</p>
        <p class="status" aria-live="polite">
          <span class="light" aria-hidden="true"></span>
          <span class="state-label">Disconnected</span>
        </p>
        <button type="button">Plug in earbuds</button>
      </section>
    </div>

    <div class="battery-control">
      <label for="battery">Simulated battery level</label>
      <input id="battery" type="range" min="0" max="100" value="70" aria-describedby="battery-hint">
      <p class="hint" id="battery-hint">At 50% or higher, plugging in starts charging. Below 50%, plug in and then press power. Charging stops at 0%.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
